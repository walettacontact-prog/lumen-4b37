<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sayfa bulunamadı | Nurettin Ensar Ocakçı</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#060606;--fg:#f3f0ea;--mute:#8f8b83;--line:rgba(243,240,234,.13);--accent:#ff5a1f;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--fg);font:16px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}
.code{font-size:clamp(88px,20vw,200px);font-weight:600;letter-spacing:-.06em;line-height:1}
.code span{color:var(--accent)}
p{color:var(--mute);margin:12px 0 32px}
a{display:inline-flex;align-items:center;height:52px;padding:0 24px;border:1px solid var(--line);border-radius:999px;color:var(--fg);text-decoration:none;transition:border-color .3s}
a:hover{border-color:var(--fg)}
</style>
</head>
<body>
<main>
  <div class="code">4<span>0</span>4</div>
  <p>Burada bir şey yok. Belki uzayda kaybolmuştur.</p>
  <a href="/">Ana sayfaya dön</a>
</main>
</body>
</html>
